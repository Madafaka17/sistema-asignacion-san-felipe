# Integración continua en cada push y pull request: análisis estático y
# pruebas de los tres paquetes, cobertura del núcleo (RNF-07), construcción
# de las imágenes Docker y prueba de ciclo completo (E2E) contra el entorno
# de docker compose, con su salida y capturas como artefacto del commit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dominio:
    name: Núcleo (paquetes/dominio)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: paquetes/dominio
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - name: Pruebas y cobertura del núcleo (≥ 80 %, RNF-07)
        working-directory: .
        run: herramientas/cobertura.sh | tee cobertura.txt
      - name: P-17 (RNF-02) — AG oficial con 112 servicios y 10 semillas, cada ejecución ≤ 300 s
        run: dart run tool/p17.dart ../../evidencia-p17
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-dominio
          path: |
            cobertura.txt
            paquetes/dominio/coverage/lcov.info
            evidencia-p17/

  experimento:
    name: Experimento Python (Anexo E, core/ y poc_cap3/ originales)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experimentos/sanfelipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes --no-deps -r ../../requirements.lock
      - name: Huellas de los 14 archivos registrados antes de la ejecución (protocolo, core/ y poc_cap3/)
        run: |
          grep -E '^[0-9a-f]{64}' registro_protocolo.txt \
            | sed 's#experimentos/sintetico_sanfelipe/##; s#  experimentos/poc_cap3/#  ../poc_cap3/#; s#  core/#  ../../core/#' \
            | sha256sum -c
      - name: Reevaluación de las 1 320 soluciones registradas y de los óptimos de n = 7
        run: python reevaluar_cromosomas.py
      - name: Generador, datos e incertidumbre se regeneran sin cambios
        run: |
          python verificar_generador.py > /dev/null
          python exportar_datos.py
          python incertidumbre_bootstrap.py > /dev/null
          git diff --exit-code -- datos incertidumbre_brecha.csv
      - name: Corrida paso a paso del capítulo IV (traza n = 7, instancia 101, semilla 1)
        working-directory: .
        run: |
          PYTHONHASHSEED=0 python -I pruebas/corrida/trazar_corrida.py . 7 101 1 traza.json
          python - <<'EOF'
          import json
          a = json.load(open("traza.json")); b = json.load(open("pruebas/corrida/traza_n7_101_s1.json"))
          distintos = [k for k in b if k not in ("tiempo_traza_s", "entorno") and a.get(k) != b[k]]
          assert not distintos, distintos
          print("traza idéntica a la registrada")
          EOF

  nucleo-python:
    name: Núcleo Python (100 casos del Anexo I y 9 de tests/test_core.py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - name: pruebas/nucleo (109 pruebas; sin las 300 corridas estocásticas)
        run: SIN_ESTOCASTICAS=1 SALIDA_PRUEBAS="$PWD/salidas-ci" PYTHON=python bash pruebas/nucleo/ejecutar_pruebas.sh
      - name: Ninguna prueba falló
        run: grep -E "^=+ 109 passed" salidas-ci/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-nucleo
          path: salidas-ci/

  servidor:
    name: Servidor (pruebas de aceptación sobre MySQL)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: raiz-ci
          MYSQL_DATABASE: sanfelipe_pruebas
          MYSQL_USER: sanfelipe
          MYSQL_PASSWORD: clave-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -praiz-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: servidor
    env:
      PRUEBAS_DB_HOST: 127.0.0.1
      PRUEBAS_DB_PORT: 3306
      PRUEBAS_DB_NAME: sanfelipe_pruebas
      PRUEBAS_DB_USER: sanfelipe
      PRUEBAS_DB_PASSWORD: clave-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - run: dart analyze --fatal-infos
      - run: dart test

  cliente:
    name: Cliente Flutter (unitarias y de widgets)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cliente
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test

  docker:
    name: Imágenes Docker (docker compose build)
    runs-on: ubuntu-24.04
    needs: [dominio, servidor, cliente]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build

  e2e:
    name: Ciclo completo (E2E, escritorio Linux)
    runs-on: ubuntu-24.04
    needs: [dominio, servidor, cliente]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Entorno completo (MySQL, servidor y cliente web)
        run: docker compose up -d --build --wait
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Dependencias de Flutter para escritorio Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb imagemagick
      - run: flutter pub get --enforce-lockfile
        working-directory: cliente
      - name: Pruebas de integración (interfaz → servidor → MySQL → interfaz)
        run: |
          set -o pipefail
          mkdir -p evidencia-e2e
          {
            echo "commit: $GITHUB_SHA"
            echo "fecha (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            CAPTURAS=evidencia-e2e/capturas herramientas/e2e.sh
          } 2>&1 | tee evidencia-e2e/salida.txt
      - name: Registros del entorno si falla
        if: failure()
        run: docker compose logs --no-color > evidencia-e2e/docker.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-e2e
          path: evidencia-e2e/
