name: servidor
description: >-
  Servidor (backend) del sistema de asignación de recursos: API REST,
  lógica de negocio, núcleo de optimización y persistencia en MySQL.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  crypto: 3.0.7
  dart_jsonwebtoken: 3.4.1
  dominio:
    path: ../paquetes/dominio
  logging: 1.3.0
  mysql_client_plus: 0.1.3
  shelf: 1.4.2
  shelf_router: 1.1.4
  yaml: 3.1.4

dev_dependencies:
  lints: 6.1.0
  test: 1.32.0
