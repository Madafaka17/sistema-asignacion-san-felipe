# Cliente web (Flutter) y proxy inverso de la API en el mismo origen:
# el navegador habla solo con este servidor, así la cookie HttpOnly del
# token de actualización es del mismo sitio y no hace falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location /api/ {
        proxy_pass http://servidor:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La generación de la programación puede tardar hasta t_lím = 300 s.
        proxy_read_timeout 330s;
        client_max_body_size 1m;
        # El servidor ya envía estas cabeceras; se usan las de nginx para no duplicarlas.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # index.html y el service worker nunca se guardan en caché: así cada
    # despliegue llega al navegador y cliente y servidor siguen en la
    # misma versión del contrato.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
